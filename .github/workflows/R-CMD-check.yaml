name: R-CMD-check

on:
  pull_request:
    branches: [ master ]
  workflow_call:
    inputs:
      revision:
        description: Exact version commit to check
        required: true
        type: string
  workflow_dispatch:
    inputs:
      revision:
        description: Commit or tag to check (defaults to selected branch)
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: '4.4.1' }
          - { os: macOS-latest, r: '4.4.1' }
          - { os: windows-latest, r: '4.4.1' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev cmake
        if: runner.os == 'Linux'

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat, any::roxygen2
          needs: check

      - name: Run R CMD check
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}
